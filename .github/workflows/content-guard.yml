name: content guard

# The backstop the local pre-commit hook cannot be: this runs on the remote, on
# every push and pull request, and `--no-verify` has no effect on it.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # --history needs every ref, not just the tip

      # The banned-pattern list is not stored in the repo (it is the very thing
      # the guard prevents committing). CI loads it from a repository secret when
      # one is configured, and skips cleanly when none is — so the check is green
      # until freshet-015 sets CONTENT_GUARD_PATTERNS, then guarding turns on with
      # no workflow change. The local pre-commit hook still fails closed regardless.
      - name: Resolve pattern source
        id: patterns
        run: |
          if [ -n "${{ secrets.CONTENT_GUARD_PATTERNS }}" ]; then
            printf '%s' "${{ secrets.CONTENT_GUARD_PATTERNS }}" > "$RUNNER_TEMP/patterns.b64"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::content-guard: no pattern source configured; scan skipped (freshet-015 wires this)."
          fi

      - name: Scan the work tree
        if: steps.patterns.outputs.configured == 'true'
        env:
          FRESHET_GUARD_PATTERNS: ${{ runner.temp }}/patterns.b64
        run: bash .freshet/content-guard.sh --tree

      - name: Scan the commit history
        if: steps.patterns.outputs.configured == 'true'
        env:
          FRESHET_GUARD_PATTERNS: ${{ runner.temp }}/patterns.b64
        run: bash .freshet/content-guard.sh --history
