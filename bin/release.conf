# Freshet release toolchain — the per-plugin half.
#
# bin/build-release.sh, bin/deploy-svn.sh, bin/render-assets.sh and
# bin/pngcrop.js are identical in every Freshet plugin repo. Everything that
# differs between plugins is data and lives here.

SLUG="freshet-uploadmax"
VERSION_FILE="freshet-uploadmax.php"
VERSION_CONST="FRESHET_UPLOADMAX_VERSION"

# Build steps this plugin needs (1 = run, 0 = skip).
BUILD_NPM=0        # no JS build step
BUILD_COMPOSER=0   # no composer dependencies
SALES_ZIP=0        # free plugin — the directory archive is the only one
TAG_RELEASE=0      # tagging a release is a deliberate, separate step here

# Excluded on top of the shared baseline in bin/build-release.sh.
EXTRA_EXCLUDES=()

# Removed from the wp.org archive only. Nothing to strip: this plugin ships no
# license checks, no update injection and no upsell surfaces in any build.
WPORG_STRIP=()

# wp.org page assets to rasterise: <svg> <render-size> <out.png> <crop-height>
# Empty until the artwork exists.
ASSET_RENDERS=()

# wordpress.org SVN.
SVN_USER="kristoffbertram"
